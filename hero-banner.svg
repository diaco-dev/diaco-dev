<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0A1122" />
      <stop offset="100%" stop-color="#070B16" />
    </linearGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.25" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#334155" fill-opacity="0.5" />
    </pattern>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      
      .pulse-node {
        animation: pulse 3s infinite ease-in-out;
      }
      .pulse-node-delayed {
        animation: pulse 3s infinite ease-in-out 1.5s;
      }
      .float-slow {
        animation: float 6s infinite ease-in-out;
      }
      .dash-flow {
        stroke-dasharray: 6 8;
        animation: dash 12s linear infinite;
      }
      .status-dot {
        animation: blink 2s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -240; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Ambient Lighting -->
  <circle cx="950" cy="190" r="280" fill="url(#cyanGlow)" />
  <circle cx="250" cy="80" r="220" fill="url(#emeraldGlow)" />

  <!-- RIGHT SIDE: 3D-Style Isometric Enterprise Architecture & AI Mesh -->
  <g class="float-slow" transform="translate(0, 0)">
    <!-- Outer Perspective Hexagon Frame -->
    <polygon points="960,45 1130,115 1130,265 960,335 790,265 790,115" 
             fill="#0B1325" fill-opacity="0.4" stroke="#1E293B" stroke-width="1.5" />
    <polygon points="960,75 1095,132 1095,248 960,305 825,248 825,132" 
             fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1" class="dash-flow" />

    <!-- Network Edges (Paths for Data Packets) -->
    <path id="edge1" d="M 960,190 L 840,125" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5" fill="none" />
    <path id="edge2" d="M 960,190 L 1085,125" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.5" fill="none" />
    <path id="edge3" d="M 960,190 L 840,255" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5" fill="none" />
    <path id="edge4" d="M 960,190 L 1085,255" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5" fill="none" />
    <path id="edge5" d="M 960,190 L 960,70" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5" fill="none" />
    <path id="edge6" d="M 960,190 L 960,310" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.5" fill="none" />

    <!-- Cross-mesh connections -->
    <line x1="840" y1="125" x2="960" y2="70" stroke="#334155" stroke-width="1" />
    <line x1="1085" y1="125" x2="960" y2="70" stroke="#334155" stroke-width="1" />
    <line x1="840" y1="255" x2="960" y2="310" stroke="#334155" stroke-width="1" />
    <line x1="1085" y1="255" x2="960" y2="310" stroke="#334155" stroke-width="1" />
    <line x1="840" y1="125" x2="840" y2="255" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="1085" y1="125" x2="1085" y2="255" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Animated Data Packets along edges -->
    <circle r="3.5" fill="#38BDF8" filter="url(#glow)">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M 960,190 L 840,125" />
    </circle>
    <circle r="3.5" fill="#10B981" filter="url(#glow)">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M 960,190 L 1085,125" />
    </circle>
    <circle r="3.5" fill="#818CF8" filter="url(#glow)">
      <animateMotion dur="2.5s" repeatCount="indefinite" path="M 840,255 L 960,190" />
    </circle>
    <circle r="3.5" fill="#F59E0B" filter="url(#glow)">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M 1085,255 L 960,190" />
    </circle>
    <circle r="3" fill="#38BDF8" filter="url(#glow)">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M 960,190 L 960,70" />
    </circle>

    <!-- Satellite Nodes -->
    <!-- Top Node: AI Engine -->
    <g transform="translate(960, 70)">
      <rect x="-52" y="-16" width="104" height="32" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" fill="#E0F2FE" class="font-mono" font-size="11" font-weight="600">AI ON DATA</text>
    </g>

    <!-- Top-Left Node: ERP Core -->
    <g transform="translate(840, 125)">
      <rect x="-48" y="-16" width="96" height="32" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" fill="#38BDF8" class="font-mono" font-size="11" font-weight="600">Odoo / ERP</text>
    </g>

    <!-- Top-Right Node: FastAPI / Django -->
    <g transform="translate(1085, 125)">
      <rect x="-56" y="-16" width="112" height="32" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" fill="#6EE7B7" class="font-mono" font-size="11" font-weight="600">Django/FastAPI</text>
    </g>

    <!-- Bottom-Left Node: Workflow Automation -->
    <g transform="translate(840, 255)">
      <rect x="-52" y="-16" width="104" height="32" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" fill="#C7D2FE" class="font-mono" font-size="11" font-weight="600">Automation</text>
    </g>

    <!-- Bottom-Right Node: Access Control -->
    <g transform="translate(1085, 255)">
      <rect x="-52" y="-16" width="104" height="32" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" fill="#FDE68A" class="font-mono" font-size="11" font-weight="600">Zero-Trust/RBAC</text>
    </g>

    <!-- Bottom Node: Domains -->
    <g transform="translate(960, 310)">
      <rect x="-64" y="-15" width="128" height="30" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#A7F3D0" class="font-mono" font-size="10.5">SaaS • Logistics • Health</text>
    </g>

    <!-- Center Core Hub -->
    <g transform="translate(960, 190)">
      <circle r="38" fill="#0EA5E9" fill-opacity="0.15" class="pulse-node" />
      <circle r="28" fill="#0F172A" stroke="#38BDF8" stroke-width="2" filter="url(#glow)" />
      <text x="0" y="-3" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="10" font-weight="700">CORE</text>
      <text x="0" y="10" text-anchor="middle" fill="#38BDF8" class="font-mono" font-size="8.5">ENGINE</text>
    </g>
  </g>

  <!-- LEFT SIDE: Glassmorphic Executive Intro Card -->
  <g transform="translate(42, 34)">
    <!-- Card Background -->
    <rect width="710" height="312" rx="14" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

    <!-- Top Terminal Status Bar -->
    <circle cx="26" cy="26" r="5" fill="#EF4444" fill-opacity="0.8" />
    <circle cx="44" cy="26" r="5" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="62" cy="26" r="5" fill="#10B981" fill-opacity="0.8" />
    <text x="84" y="30" fill="#64748B" class="font-mono" font-size="11.5">ario@enterprise-architect:~/profile</text>

    <!-- Live Production Badge -->
    <rect x="520" y="14" width="168" height="24" rx="12" fill="#064E3B" fill-opacity="0.5" stroke="#10B981" stroke-width="0.8" />
    <circle cx="534" cy="26" r="4" fill="#10B981" class="status-dot" />
    <text x="546" y="30" fill="#A7F3D0" class="font-mono" font-size="10.5" font-weight="600">7+ YRS IN PRODUCTION</text>

    <line x1="0" y1="48" x2="710" y2="48" stroke="#1E293B" stroke-width="1" />

    <!-- Main Heading -->
    <text x="32" y="102" fill="url(#titleGrad)" class="font-sans" font-size="36" font-weight="800" letter-spacing="-0.5">
      Hi, I'm Ario Hasan-abbadi
    </text>

    <!-- Role & Specialization Subtitle -->
    <text x="32" y="136" fill="#38BDF8" class="font-sans" font-size="14.5" font-weight="700">
      Senior Software Engineer  |  ERP Systems &amp; Business Process Automation
    </text>
    <text x="32" y="158" fill="#94A3B8" class="font-mono" font-size="13" font-weight="500">
      Odoo, Python (Django, FastAPI)  •  AI on Enterprise Data
    </text>

    <!-- Divider Accent -->
    <rect x="32" y="176" width="85" height="3" rx="1.5" fill="#38BDF8" />
    <rect x="125" y="176" width="35" height="3" rx="1.5" fill="#10B981" />

    <!-- Bio Description -->
    <text x="32" y="206" fill="#CBD5E1" class="font-sans" font-size="13.5">
      I design and ship enterprise back-end systems: multi-module ERPs, workflow
    </text>
    <text x="32" y="226" fill="#CBD5E1" class="font-sans" font-size="13.5">
      automation, secure access control, and AI features on top of business data.
    </text>
    <text x="32" y="246" fill="#94A3B8" class="font-sans" font-size="13">
      7+ years across healthcare, logistics, SaaS, coaching &amp; education — leading teams.
    </text>

    <!-- Bottom Tech Pills -->
    <g transform="translate(32, 266)">
      <rect x="0" y="0" width="128" height="26" rx="5" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="64" y="17" text-anchor="middle" fill="#38BDF8" class="font-mono" font-size="11">Multi-Module ERP</text>

      <rect x="138" y="0" width="136" height="26" rx="5" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="206" y="17" text-anchor="middle" fill="#10B981" class="font-mono" font-size="11">Python • FastAPI</text>

      <rect x="284" y="0" width="128" height="26" rx="5" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="348" y="17" text-anchor="middle" fill="#818CF8" class="font-mono" font-size="11">Odoo • Django</text>

      <rect x="422" y="0" width="146" height="26" rx="5" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="495" y="17" text-anchor="middle" fill="#F59E0B" class="font-mono" font-size="11">Enterprise AI &amp; RBAC</text>
    </g>
  </g>
</svg>
