<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="55%" stop-color="#0A1124" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.35" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ambient Lighting -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Blueprint Grid -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.65" />
      <circle cx="36" cy="36" r="0.9" fill="#38BDF8" fill-opacity="0.35" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }

      .float-group { animation: float 6s ease-in-out infinite; }
      .spin-slow { transform-origin: 965px 190px; animation: spin 28s linear infinite; }
      .spin-reverse { transform-origin: 965px 190px; animation: spinRev 20s linear infinite; }
      .pulse-core { transform-origin: 965px 190px; animation: pulse 3.2s ease-in-out infinite; }
      .blink { animation: blinkAnim 2s ease-in-out infinite; }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.75; transform: scale(0.97); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes blinkAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Background & Grid -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <circle cx="965" cy="190" r="260" fill="url(#cyanGlow)" />
  <circle cx="240" cy="90" r="210" fill="url(#emeraldGlow)" />

  <!-- ==================== RIGHT SIDE: 3D WIREFRAME & ARCHITECTURE MESH ==================== -->
  <g class="float-group">
    <!-- Three.js Style Tilted 3D Orbital Rings -->
    <g transform="translate(965, 190) rotate(-18)">
      <ellipse cx="0" cy="0" rx="175" ry="62" fill="none" stroke="#818CF8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="8 6" />
      <ellipse cx="0" cy="0" rx="135" ry="44" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.25" />
    </g>
    <g transform="translate(965, 190) rotate(24)">
      <ellipse cx="0" cy="0" rx="165" ry="54" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 8" />
    </g>

    <!-- Rotating Outer 3D Wireframe Polyhedron (Three.js Effect in Pure SVG) -->
    <g class="spin-slow">
      <polygon points="965,86 1055,138 1055,242 965,294 875,242 875,138" fill="none" stroke="#38BDF8" stroke-width="1.1" stroke-opacity="0.3" />
      <polygon points="965,102 1041,234 889,234" fill="none" stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.25" />
      <polygon points="965,278 1041,146 889,146" fill="none" stroke="#818CF8" stroke-width="0.9" stroke-opacity="0.25" />
      <line x1="965" y1="86" x2="965" y2="294" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.2" />
      <line x1="875" y1="138" x2="1055" y2="242" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.2" />
      <line x1="1055" y1="138" x2="875" y2="242" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.2" />
    </g>

    <!-- Counter-Rotating Inner Emerald Wireframe -->
    <g class="spin-reverse">
      <polygon points="965,130 1017,160 1017,220 965,250 913,220 913,160" fill="#0F172A" fill-opacity="0.45" stroke="#10B981" stroke-width="1.3" stroke-opacity="0.55" />
      <line x1="965" y1="130" x2="1017" y2="220" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.35" />
      <line x1="965" y1="130" x2="913" y2="220" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.35" />
      <line x1="913" y1="160" x2="1017" y2="160" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.35" />
    </g>

    <!-- Network Connection Lines to Architecture Nodes -->
    <path d="M 965,190 L 965,58" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5" fill="none" />
    <path d="M 965,190 L 832,118" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5" fill="none" />
    <path d="M 965,190 L 1098,118" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.5" fill="none" />
    <path d="M 965,190 L 832,262" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1.5" fill="none" />
    <path d="M 965,190 L 1098,262" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.5" fill="none" />
    <path d="M 965,190 L 965,322" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.5" fill="none" />

    <!-- Animated Data Streams -->
    <circle r="3.2" fill="#38BDF8" filter="url(#glow)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 965,190 L 832,118" />
    </circle>
    <circle r="3.2" fill="#10B981" filter="url(#glow)">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M 965,190 L 1098,118" />
    </circle>
    <circle r="3.2" fill="#818CF8" filter="url(#glow)">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M 832,262 L 965,190" />
    </circle>
    <circle r="3.2" fill="#F59E0B" filter="url(#glow)">
      <animateMotion dur="3.1s" repeatCount="indefinite" path="M 1098,262 L 965,190" />
    </circle>
    <circle r="3" fill="#38BDF8" filter="url(#glow)">
      <animateMotion dur="2.1s" repeatCount="indefinite" path="M 965,190 L 965,58" />
    </circle>

    <!-- Floating Particle Cloud Dots -->
    <circle cx="805" cy="80" r="2" fill="#38BDF8" opacity="0.7" class="blink" />
    <circle cx="1125" cy="78" r="2.2" fill="#10B981" opacity="0.6" />
    <circle cx="790" cy="195" r="1.8" fill="#818CF8" opacity="0.7" />
    <circle cx="1142" cy="192" r="2.4" fill="#38BDF8" opacity="0.8" class="blink" />
    <circle cx="815" cy="312" r="2" fill="#10B981" opacity="0.6" />
    <circle cx="1118" cy="310" r="1.8" fill="#F59E0B" opacity="0.7" />

    <!-- Center Glowing Core -->
    <g class="pulse-core">
      <circle cx="965" cy="190" r="34" fill="#0EA5E9" fill-opacity="0.18" />
      <circle cx="965" cy="190" r="25" fill="#0F172A" stroke="#38BDF8" stroke-width="2" filter="url(#glow)" />
      <text x="965" y="187" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="9.5" font-weight="700">SYSTEM</text>
      <text x="965" y="199" text-anchor="middle" fill="#38BDF8" class="font-mono" font-size="8.5" font-weight="600">CORE</text>
    </g>

    <!-- Architecture Nodes -->
    <!-- Top: AI on Enterprise Data -->
    <g transform="translate(965, 58)">
      <rect x="-58" y="-15" width="116" height="30" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" fill="#E0F2FE" class="font-mono" font-size="10.5" font-weight="600">Enterprise AI</text>
    </g>

    <!-- Top-Left: Odoo & Multi-Module ERP -->
    <g transform="translate(832, 118)">
      <rect x="-52" y="-15" width="104" height="30" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" fill="#38BDF8" class="font-mono" font-size="10.5" font-weight="600">Odoo / ERP</text>
    </g>

    <!-- Top-Right: Django & FastAPI -->
    <g transform="translate(1098, 118)">
      <rect x="-58" y="-15" width="116" height="30" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" fill="#6EE7B7" class="font-mono" font-size="10.5" font-weight="600">Django•FastAPI</text>
    </g>

    <!-- Bottom-Left: Workflow Automation -->
    <g transform="translate(832, 262)">
      <rect x="-52" y="-15" width="104" height="30" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" fill="#C7D2FE" class="font-mono" font-size="10.5" font-weight="600">Automation</text>
    </g>

    <!-- Bottom-Right: Secure Access Control -->
    <g transform="translate(1098, 262)">
      <rect x="-56" y="-15" width="112" height="30" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" fill="#FDE68A" class="font-mono" font-size="10.5" font-weight="600">Secure RBAC</text>
    </g>

    <!-- Bottom: Production Domains -->
    <g transform="translate(965, 322)">
      <rect x="-76" y="-14" width="152" height="28" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#A7F3D0" class="font-mono" font-size="10">Health • Logistics • SaaS</text>
    </g>
  </g>

  <!-- ==================== LEFT SIDE: GLASSMORPHISM EXECUTIVE CARD ==================== -->
  <g transform="translate(38, 32)">
    <!-- Glass Card Container -->
    <rect width="714" height="316" rx="14" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />
    <!-- Left Accent Highlight Bar -->
    <rect x="0" y="24" width="3.5" height="268" rx="1.75" fill="#38BDF8" />

    <!-- Header Bar -->
    <circle cx="26" cy="26" r="4.5" fill="#EF4444" fill-opacity="0.85" />
    <circle cx="42" cy="26" r="4.5" fill="#F59E0B" fill-opacity="0.85" />
    <circle cx="58" cy="26" r="4.5" fill="#10B981" fill-opacity="0.85" />
    <text x="78" y="30" fill="#64748B" class="font-mono" font-size="11.5">// SENIOR SOFTWARE ENGINEER &amp; ARCHITECT</text>

    <!-- Status Pill -->
    <rect x="526" y="14" width="166" height="24" rx="12" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-width="0.9" />
    <circle cx="540" cy="26" r="3.8" fill="#10B981" class="blink" />
    <text x="552" y="30" fill="#A7F3D0" class="font-mono" font-size="10.5" font-weight="600">7+ YRS PRODUCTION</text>

    <line x1="0" y1="48" x2="714" y2="48" stroke="#1E293B" stroke-width="1" />

    <!-- Name Title -->
    <text x="32" y="100" fill="url(#titleGrad)" class="font-sans" font-size="36" font-weight="800" letter-spacing="-0.5">
      Hi, I'm Ario Hasan-abbadi
    </text>

    <!-- Headline Stack -->
    <text x="32" y="132" fill="#38BDF8" class="font-sans" font-size="14.5" font-weight="700">
      Senior Software Engineer | ERP Systems &amp; Business Process Automation
    </text>
    <text x="32" y="154" fill="#94A3B8" class="font-mono" font-size="12.8" font-weight="500">
      Odoo, Python (Django, FastAPI)  •  AI on Enterprise Data
    </text>

    <!-- Accent Line -->
    <rect x="32" y="170" width="90" height="3" rx="1.5" fill="#38BDF8" />
    <rect x="130" y="170" width="36" height="3" rx="1.5" fill="#10B981" />

    <!-- Exact Bio Text -->
    <text x="32" y="198" fill="#E2E8F0" class="font-sans" font-size="13.2">
      I design and ship enterprise back-end systems: multi-module ERPs, workflow automation,
    </text>
    <text x="32" y="218" fill="#E2E8F0" class="font-sans" font-size="13.2">
      secure access control, and AI features on top of business data. 7+ years of production
    </text>
    <text x="32" y="238" fill="#94A3B8" class="font-sans" font-size="13.2">
      work across healthcare, logistics, SaaS, coaching and education, leading cross-functional
    </text>
    <text x="32" y="256" fill="#94A3B8" class="font-sans" font-size="13.2">
      teams along the way.
    </text>

    <!-- Bottom Domain Tags -->
    <g transform="translate(32, 272)">
      <rect x="0" y="0" width="136" height="26" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
      <text x="68" y="17" text-anchor="middle" fill="#E0F2FE" class="font-mono" font-size="11">Multi-Module ERP</text>

      <rect x="146" y="0" width="154" height="26" rx="6" fill="#0F172A" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
      <text x="223" y="17" text-anchor="middle" fill="#A7F3D0" class="font-mono" font-size="11">Workflow Automation</text>

      <rect x="310" y="0" width="118" height="26" rx="6" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1" />
      <text x="369" y="17" text-anchor="middle" fill="#C7D2FE" class="font-mono" font-size="11">Secure RBAC</text>

      <rect x="438" y="0" width="184" height="26" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1" />
      <text x="530" y="17" text-anchor="middle" fill="#FDE68A" class="font-mono" font-size="11">Cross-Functional Lead</text>
    </g>
  </g>
</svg>
